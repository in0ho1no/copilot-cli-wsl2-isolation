<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 520" width="1024" height="520" role="img" aria-labelledby="title">
  <title id="title">Windowsホスト上の既存WSL2、Gitリポジトリ、案件ごとの専用ディストリと、公式サーバへ通信するCopilot CLI本体</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0759b5"/>
    </marker>
  </defs>
  <g font-family="Yu Gothic, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="26" fill="#1f2937">
    <!-- Windows ホスト -->
    <rect x="1" y="1" width="1022" height="418" rx="16" fill="#f1f3f5" stroke="#c9d6e8" stroke-width="2"/>
    <text x="24" y="42" font-weight="700" fill="#4b5563" font-size="28">Windowsホスト</text>

    <!-- 既存の WSL2 -->
    <rect x="24" y="62" width="262" height="124" rx="12" fill="#ffffff" stroke="#c9d6e8" stroke-width="2"/>
    <text x="44" y="100" font-weight="700" font-size="28">既存のWSL2</text>
    <text x="44" y="138">AIを使わない作業</text>
    <text x="44" y="172">設定は変更しない</text>

    <!-- Git リポジトリ -->
    <rect x="24" y="202" width="262" height="196" rx="12" fill="#ffffff" stroke="#c9d6e8" stroke-width="2"/>
    <text x="44" y="240" font-weight="700" font-size="28">Gitリポジトリ</text>
    <text x="44" y="276">user-data</text>
    <text x="44" y="308">ランチャー</text>
    <text x="44" y="340">設定ファイル</text>
    <text x="44" y="380" font-weight="700" fill="#0759b5">cloud-initで構成</text>
    <line x1="290" y1="300" x2="318" y2="300" stroke="#0759b5" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- 専用ディストリ A -->
    <rect x="326" y="62" width="330" height="336" rx="14" fill="#eaf1fa" stroke="#0759b5" stroke-width="3"/>
    <text x="346" y="100" font-weight="700" font-size="28">AI-caseA</text>
    <text x="346" y="134" fill="#4b5563">（専用ディストリ）</text>
    <g font-size="24">
      <rect x="346" y="152" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="362" y="182">wsl.conf</text>
      <rect x="346" y="204" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="362" y="234">ランチャー</text>
      <rect x="346" y="256" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="362" y="286">サンドボックス</text>
    </g>
    <rect x="366" y="322" width="250" height="56" rx="10" fill="#0759b5"/>
    <text x="491" y="360" text-anchor="middle" font-weight="700" fill="#ffffff">Copilot CLI本体</text>

    <!-- 専用ディストリ B -->
    <rect x="674" y="62" width="330" height="336" rx="14" fill="#eaf1fa" stroke="#0759b5" stroke-width="3"/>
    <text x="694" y="100" font-weight="700" font-size="28">AI-caseB</text>
    <text x="694" y="134" fill="#4b5563">（専用ディストリ）</text>
    <g font-size="24">
      <rect x="694" y="152" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="710" y="182">wsl.conf</text>
      <rect x="694" y="204" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="710" y="234">ランチャー</text>
      <rect x="694" y="256" width="290" height="44" rx="8" fill="#ffffff"/>
      <text x="710" y="286">サンドボックス</text>
    </g>
    <rect x="714" y="322" width="250" height="56" rx="10" fill="#0759b5"/>
    <text x="839" y="360" text-anchor="middle" font-weight="700" fill="#ffffff">Copilot CLI本体</text>

    <!-- CLI 本体から公式サーバへ -->
    <g stroke="#0759b5" stroke-width="4" marker-end="url(#arrow)">
      <line x1="491" y1="380" x2="491" y2="448"/>
      <line x1="839" y1="380" x2="839" y2="448"/>
    </g>
    <rect x="326" y="456" width="678" height="60" rx="12" fill="#1f2937"/>
    <text x="665" y="496" text-anchor="middle" font-weight="700" fill="#ffffff" font-size="28">公式サーバ（GitHub）</text>
    <text x="24" y="478" font-weight="700" fill="#0759b5" font-size="28">通信するのは</text>
    <text x="24" y="512" font-weight="700" fill="#0759b5" font-size="28">CLI本体だけ</text>
  </g>
</svg>
