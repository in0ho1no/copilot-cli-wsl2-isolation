<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 470" width="1216" height="470" role="img" aria-labelledby="title">
  <title id="title">Gitリポジトリの1ファイルから案件ごとに専用ディストリを構築し、通信するのは各ディストリのCopilot CLI本体から公式サーバ（GitHub）へだけである構成</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0759b5"/>
    </marker>
  </defs>
  <g font-family="Yu Gothic, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="26" fill="#1f2937">
    <!-- Git リポジトリ -->
    <rect x="1" y="1" width="290" height="250" rx="14" fill="#f1f3f5" stroke="#c9d6e8" stroke-width="2"/>
    <text x="24" y="48" font-weight="700" font-size="28">Gitリポジトリ</text>
    <text x="24" y="104">user-data</text>
    <text x="24" y="138">（cloud-init）</text>
    <text x="24" y="180">ランチャー・管理設定</text>
    <text x="24" y="222">保護スクリプト</text>
    <text x="0" y="300" font-weight="700" fill="#0759b5">1ファイルから、</text>
    <text x="0" y="336" font-weight="700" fill="#0759b5">案件ごとに構築する</text>
    <line x1="296" y1="126" x2="356" y2="126" stroke="#0759b5" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- 専用ディストリ A -->
    <rect x="366" y="1" width="410" height="340" rx="14" fill="#eaf1fa" stroke="#0759b5" stroke-width="3"/>
    <text x="386" y="44" font-weight="700" font-size="28">AI-caseA（専用ディストリ）</text>
    <g font-size="24">
      <rect x="386" y="64" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="402" y="97">wsl.conf：Windowsに届かない</text>
      <rect x="386" y="122" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="402" y="155">ランチャー：環境変数を絞る</text>
      <rect x="386" y="180" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="402" y="213">サンドボックス：AIのコマンド</text>
    </g>
    <rect x="386" y="256" width="370" height="60" rx="10" fill="#0759b5"/>
    <text x="571" y="296" text-anchor="middle" font-weight="700" fill="#ffffff">Copilot CLI本体</text>

    <!-- 専用ディストリ B -->
    <rect x="804" y="1" width="410" height="340" rx="14" fill="#eaf1fa" stroke="#0759b5" stroke-width="3"/>
    <text x="824" y="44" font-weight="700" font-size="28">AI-caseB（専用ディストリ）</text>
    <g font-size="24">
      <rect x="824" y="64" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="840" y="97">wsl.conf：Windowsに届かない</text>
      <rect x="824" y="122" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="840" y="155">ランチャー：環境変数を絞る</text>
      <rect x="824" y="180" width="370" height="48" rx="8" fill="#ffffff"/>
      <text x="840" y="213">サンドボックス：AIのコマンド</text>
    </g>
    <rect x="824" y="256" width="370" height="60" rx="10" fill="#0759b5"/>
    <text x="1009" y="296" text-anchor="middle" font-weight="700" fill="#ffffff">Copilot CLI本体</text>

    <!-- CLI 本体から公式サーバへ -->
    <g stroke="#0759b5" stroke-width="4" marker-end="url(#arrow)">
      <line x1="571" y1="318" x2="571" y2="396"/>
      <line x1="1009" y1="318" x2="1009" y2="396"/>
    </g>
    <rect x="366" y="404" width="848" height="64" rx="12" fill="#1f2937"/>
    <text x="790" y="446" text-anchor="middle" font-weight="700" fill="#ffffff" font-size="28">公式サーバ（GitHub）</text>
    <text x="0" y="432" font-weight="700" fill="#0759b5">通信するのは</text>
    <text x="0" y="466" font-weight="700" fill="#0759b5">CLI本体だけ</text>
  </g>
</svg>
