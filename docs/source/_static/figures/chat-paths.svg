<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title">
  <title id="title">Copilot Chat（VS Code）からコマンド実行・Web取得・MCPサーバを経由して外部へつながる経路</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <g font-family="Yu Gothic, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" fill="#1f2937">
    <text x="0" y="30" font-weight="700" fill="#4b5563" font-size="28">AIの経路</text>

    <rect x="0" y="50" width="240" height="270" rx="14" fill="#0759b5"/>
    <text x="120" y="176" text-anchor="middle" font-weight="700" fill="#ffffff">Copilot Chat</text>
    <text x="120" y="218" text-anchor="middle" fill="#ffffff" font-size="28">（VS Code）</text>

    <rect x="320" y="50" width="280" height="80" rx="12" fill="#ffffff" stroke="#0759b5" stroke-width="3"/>
    <text x="460" y="101" text-anchor="middle">コマンド実行</text>
    <rect x="320" y="145" width="280" height="80" rx="12" fill="#ffffff" stroke="#0759b5" stroke-width="3"/>
    <text x="460" y="196" text-anchor="middle">Web取得</text>
    <rect x="320" y="240" width="280" height="80" rx="12" fill="#ffffff" stroke="#0759b5" stroke-width="3"/>
    <text x="460" y="291" text-anchor="middle">MCPサーバ</text>

    <g stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)">
      <line x1="244" y1="90" x2="312" y2="90"/>
      <line x1="244" y1="185" x2="312" y2="185"/>
      <line x1="244" y1="280" x2="312" y2="280"/>
      <line x1="604" y1="90" x2="672" y2="90"/>
      <line x1="604" y1="185" x2="672" y2="185"/>
      <line x1="604" y1="280" x2="672" y2="280"/>
    </g>

    <rect x="680" y="50" width="220" height="270" rx="14" fill="#1f2937"/>
    <text x="790" y="196" text-anchor="middle" font-weight="700" fill="#ffffff">外部</text>
  </g>
</svg>
